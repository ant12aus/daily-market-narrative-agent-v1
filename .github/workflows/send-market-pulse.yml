name: send-market-pulse
on:
  schedule:
    # 12:15 UTC covers 08:15 during EDT; 13:15 UTC covers 08:15 during EST
    - cron: '15 12 * * 1-5'
    - cron: '15 13 * * 1-5'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gate on 08:15 America/New_York and send
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          SUBJECT: 'Morning Market Pulse'
          PREVIEW: 'Neutral tone; earnings cluster; policy window ahead.'
          HTML_PATH: 'morning_market_pulse_sample.html'
          REPLY_TO: ${{ secrets.REPLY_TO }} # optional
        run: |
          # Only run at exactly 08:15 America/New_York
          if [ "$(TZ=America/New_York date +%H%M)" != "0815" ]; then
            echo "Not 08:15 America/New_York; skipping."
            exit 0
          fi
          python -m pip install --upgrade pip
          python send_mail.py
