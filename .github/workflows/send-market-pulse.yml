name: send-market-pulse
on:
  schedule:
    - cron: '15 12 * * 1-5'
    - cron: '15 13 * * 1-5'
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Send immediately (ignore 08:15 gate)'
        required: false
        default: 'false'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gate + Send
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          SUBJECT: 'Morning Market Pulse'
          PREVIEW: 'Neutral tone; earnings cluster; policy window ahead.'
          HTML_PATH: 'morning_market_pulse_sample.html'
          REPLY_TO: ${{ secrets.REPLY_TO }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: |
          echo "Trigger: ${GITHUB_EVENT_NAME}"
          echo "FORCE_SEND: ${FORCE_SEND}"
          echo "NY time: $(TZ=America/New_York date)"

          # If cron-triggered AND not forced, enforce the strict 08:15 ET gate
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${FORCE_SEND}" != "true" ]; then
            if [ "$(TZ=America/New_York date +%H%M)" != "0815" ]; then
              echo "Not 08:15 America/New_York; skipping (scheduled run)."
              exit 0
            fi
          fi

          echo "Proceeding — sending email now..."
          python send_mail.py
